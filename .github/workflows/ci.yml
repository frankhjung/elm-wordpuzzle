name: CI

on:
  push:
    branches: ["*"]
    tags-ignore: ["*"]
  pull_request:

jobs:
  validate:
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Elm compiler
        uses: jorelali/setup-elm@v6
        with:
          elm-version: 0.19.1

      - name: Cache Elm packages
        uses: actions/cache@v4
        with:
          path: ~/.elm
          key: ${{ runner.os }}-elm-${{ hashFiles('elm.json', 'review/elm.json') }}
          restore-keys: |
            ${{ runner.os }}-elm-

      - name: Install dependencies
        run: npm ci

      - name: Verify code formatting
        run: ./node_modules/.bin/elm-format --validate src tests

      - name: Run linter
        run: ./node_modules/.bin/elm-review

      - name: Run unit and property tests
        run: ./node_modules/.bin/elm-test

      - name: Build production bundle
        run: make build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
